name: Weather
options:
  bundleIdPrefix: com.limhiru
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.2'
    CURRENT_PROJECT_VERSION: '3'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: 물결 날씨
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 내 주변의 기상청 날씨 예보를 확인하기 위해 위치를 사용합니다.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  configs:
    Debug:
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
targets:
  Weather:
    type: application
    platform: iOS
    sources:
      - Weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limhiru.weather
        TARGETED_DEVICE_FAMILY: '1,2'
  WeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WeatherTests
    dependencies:
      - target: Weather
schemes:
  Weather:
    build:
      targets:
        Weather: all
    test:
      targets:
        - WeatherTests
