name: Weather checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s server/tests -v
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/version.py --check
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: weather-android-debug
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - run: xcodebuild -project ios_app/Weather.xcodeproj -scheme Weather -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
